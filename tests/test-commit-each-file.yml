name: Test commit-each-file with dry-run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple workflow files to sync
        run: |
          mkdir -p workflows
          cat > workflows/workflow-a.yml << 'EOF'
          name: Workflow A
          on:
            push:
              branches:
                - main
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
          EOF
          cat > workflows/workflow-b.yml << 'EOF'
          name: Workflow B
          on:
            pull_request:
          jobs:
            lint:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
          EOF

      - id: action
        name: Run action with commit-each-file in dry-run mode
        uses: .
        with:
          REPOSITORIES: |
            ${{ github.repository }}
          WORKFLOW_FILES: |
            workflow-a.yml
            workflow-b.yml
          WORKFLOW_FILES_DIR: workflows
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: 'true'
          COMMIT_EACH_FILE: 'true'

      - name: Assert action completed with commit-each-file option
        run: |
          echo "Action completed successfully with COMMIT_EACH_FILE=true in dry-run mode"
          echo "PASS"
