name: Test Basic Dry Run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create workflow file to sync
        run: |
          mkdir -p workflows
          cat > workflows/test-workflow.yml << 'EOF'
          name: Test Workflow
          on:
            push:
              branches: [main]
          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
          EOF

      - id: action
        uses: .
        with:
          REPOSITORIES: |
            ${{ github.repository }}
          WORKFLOW_FILES: |
            test-workflow.yml
          WORKFLOW_FILES_DIR: workflows
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: 'true'

      - name: Assert action completed successfully
        run: |
          echo "Action completed in dry-run mode"
          echo "PASS: action ran without error"
