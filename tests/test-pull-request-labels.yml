name: Test pull request with labels
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create workflow file to sync
        run: |
          mkdir -p workflows
          cat > workflows/ci.yml << 'EOF'
          name: CI
          on: [push]
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - run: echo build
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          REPOSITORIES: |
            some-org/some-repo
          WORKFLOW_FILES: |
            ci.yml
          WORKFLOW_FILES_DIR: workflows
          GITHUB_TOKEN: fake-token-for-pr-test
          DRY_RUN: 'true'
          PULL_REQUEST: 'true'
          PULL_REQUEST_LABELS: 'sync,automated,workflow'
          AUTO_CREATE_NEW_BRANCH: 'false'
          COMMIT_EACH_FILE: 'false'
          SKIP_CI: 'false'
          COMMIT_MESSAGE: 'false'
          COMMIT_MESSAGE_AS_PR_TITLE: 'true'
          RETRY_MODE: 'false'

      - name: Assert action ran with pull request labels config
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # In dry-run with a fake token, the action may fail at API call stage
          # but it should have started and processed inputs (including PULL_REQUEST_LABELS).
          # We accept both success and failure outcomes since we're using a fake token.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with PULL_REQUEST_LABELS configured (outcome: ${{ steps.action.outcome }})"
