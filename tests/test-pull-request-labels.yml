name: Test pull-request-labels input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy workflow file to sync
        run: |
          mkdir -p workflows
          cat > workflows/test-sync.yml << 'EOF'
          name: Test Sync Workflow
          on: [push]
          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - run: echo hello
          EOF

      - id: action
        uses: .
        with:
          REPOSITORIES: |
            ${{ github.repository }}
          WORKFLOW_FILES: |
            test-sync.yml
          WORKFLOW_FILES_DIR: workflows
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: 'true'
          PULL_REQUEST: 'false'
          PULL_REQUEST_LABELS: 'sync,automated'
          SKIP_CI: 'true'
        continue-on-error: true

      - name: Assert action ran with PULL_REQUEST_LABELS input
        run: |
          echo "Action completed (dry-run mode with PULL_REQUEST_LABELS set)"
          echo "PULL_REQUEST_LABELS input was accepted by the action"
          echo "PASS"
