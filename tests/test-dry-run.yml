name: Test dry-run mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy workflow file to sync
        run: |
          mkdir -p workflows
          cat > workflows/ci.yml <<'EOF'
          name: CI
          on: [push]
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
          EOF

      - id: action
        uses: .
        with:
          REPOSITORIES: |
            varunsridharan/demo-repo
          WORKFLOW_FILES: |
            ci.yml
          WORKFLOW_FILES_DIR: workflows
          GITHUB_TOKEN: fake-token-for-dry-run
          DRY_RUN: 'true'
          SKIP_CI: 'true'
        continue-on-error: true

      - name: Assert action ran (dry-run should not crash on auth errors)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # In dry-run mode the action may fail due to invalid token when
          # trying to resolve repos, but it should at least start up.
          # We verify the step was reached (not skipped).
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action step was executed (outcome: ${{ steps.action.outcome }})"
