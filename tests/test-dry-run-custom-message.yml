name: Test Dry Run With Custom Commit Message
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create workflow file to sync
        run: |
          mkdir -p workflows
          cat > workflows/deploy.yml << 'EOF'
          name: Deploy
          on:
            push:
              branches: [main]
          jobs:
            deploy:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - run: echo "deploy"
          EOF

      - id: action
        uses: .
        with:
          REPOSITORIES: |
            ${{ github.repository }}
          WORKFLOW_FILES: |
            deploy.yml
          WORKFLOW_FILES_DIR: workflows
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: 'true'
          COMMIT_MESSAGE: 'chore: sync workflow files [automated]'

      - name: Assert action completed successfully
        run: |
          echo "Action completed in dry-run mode with custom commit message"
          echo "PASS: action ran without error"
