name: Test dry-run with custom configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create workflow file to sync
        run: |
          mkdir -p workflows
          cat > workflows/ci.yml << 'EOF'
          name: CI
          on:
            push:
              branches:
                - main
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
          EOF

      - id: action
        uses: .
        with:
          REPOSITORIES: |
            varunsridharan/test-repo
          WORKFLOW_FILES: |
            ci.yml
          WORKFLOW_FILES_DIR: workflows
          GITHUB_TOKEN: fake-token-for-dry-run
          DRY_RUN: 'true'
          GIT_USER: 'Test Bot'
          GIT_EMAIL: 'testbot@example.com'
          COMMIT_MESSAGE: 'chore: sync workflow files'
          SKIP_CI: 'true'
          COMMIT_EACH_FILE: 'false'
        continue-on-error: true

      - name: Assert action ran with custom config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should run (not be skipped) even with a fake token in dry-run mode
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with custom configuration (outcome: $OUTCOME)"
